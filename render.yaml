# Render blueprint. Creates the web service and its database together, so the deployment is
# reproducible from the repository rather than from remembered dashboard clicks.
#
# Deployment is out of scope for the assignment itself; this exists so the project can be hosted
# as a portfolio piece. It was developed on a `deploy` branch and has since been merged, so it
# tracks `main`.

services:
  - type: web
    name: notifly
    runtime: docker
    plan: free
    region: singapore
    branch: main
    healthCheckPath: /api/v1/auth/login

    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod

      # Supplied piece by piece rather than as Render's connectionString, which is a
      # postgres://user:pass@host/db URL that the JDBC driver rejects outright. The prod profile
      # assembles a proper jdbc:postgresql:// URL from these three.
      - key: DB_HOST
        fromDatabase:
          name: notifly-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: notifly-db
          property: port
      - key: DB_NAME
        fromDatabase:
          name: notifly-db
          property: database
      - key: DB_USERNAME
        fromDatabase:
          name: notifly-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: notifly-db
          property: password

      # Generated once by Render and then held constant. The service refuses to start with the
      # development keys under the prod profile, so these must be real values.
      - key: JWT_SECRET
        generateValue: true
      - key: ENCRYPTION_KEY
        generateValue: true

      # Change these in the Render dashboard after the first deploy.
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false

      # The free instance has 512MB. The default pool of 20 connections is far more than it can
      # use and more than the free database allows.
      - key: DB_POOL_SIZE
        value: 5

databases:
  - name: notifly-db
    plan: free
    region: singapore
    databaseName: notifications
    user: notify
