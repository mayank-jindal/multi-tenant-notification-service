# Production profile.
#
# Under this profile the service refuses to start with the checked-in development JWT and
# encryption keys — see JwtService and CredentialCipher. That is deliberate: a default secret
# reaching production is one of the most common ways a service like this is compromised, and
# startup is the only reliable moment to catch it.

spring:
  datasource:
    # Assembled from the parts a managed provider supplies. Most of them hand out a
    # postgres://user:pass@host/db connection string, which the JDBC driver will not accept, so
    # the URL is built here rather than passed through.
    # sslmode defaults to require, because a managed database reached over the public internet
    # should not be spoken to in clear text. It stays overridable so the prod profile can be
    # exercised locally against a database without TLS - a profile that cannot be tested before
    # it is deployed is a profile nobody has tested.
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}?sslmode=${DB_SSLMODE:require}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

    hikari:
      # Small instances have small connection allowances. Twenty connections would exhaust a
      # free-tier database before the application even became busy.
      maximum-pool-size: ${DB_POOL_SIZE:5}
      minimum-idle: 1

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  flyway:
    enabled: true

server:
  # Behind Render's proxy, so the app must trust forwarded headers to build correct URLs.
  forward-headers-strategy: framework
  shutdown: graceful

# Pools sized for a 512MB instance rather than a development machine.
notifly:
  dispatch:
    workers:
      EMAIL: 4
      SMS: 2
      PUSH: 4
      IN_APP: 2
    queue-capacity: 200

logging:
  level:
    root: INFO
    com.notifly.notification: INFO
    org.hibernate.SQL: WARN
