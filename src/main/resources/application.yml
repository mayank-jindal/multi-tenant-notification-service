spring:
  application:
    name: multi-tenant-notification-service

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/notifications}
    username: ${DB_USERNAME:notify}
    password: ${DB_PASSWORD:notify}
    hikari:
      # The dispatch worker pools plus the request threads both draw from this pool, so it is
      # sized deliberately rather than left at the default.
      maximum-pool-size: ${DB_POOL_SIZE:20}
      minimum-idle: 5
      connection-timeout: 10000
      pool-name: notifly-cp

  jpa:
    # Schema ownership belongs to Flyway. Hibernate only verifies that the mapping matches.
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          batch_size: 50
          time_zone: UTC
        order_inserts: true
        order_updates: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false

  mail:
    # Only used when notifly.providers.email.mode is SMTP. Left blank by default so the
    # application starts with no mail account configured.
    host: ${SMTP_HOST:smtp.gmail.com}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          # Without explicit timeouts a dead relay holds a worker thread until the OS gives up,
          # which is minutes rather than seconds.
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

  jackson:
    default-property-inclusion: non_null
    # Jackson 3 (shipped with Boot 4) already renders java.time values as ISO-8601 strings by
    # default, so no explicit date handling is configured here. All timestamps are UTC.

server:
  port: ${SERVER_PORT:8080}
  error:
    # Errors are rendered centrally as RFC 7807 problem documents; the servlet container's
    # default whitelabel body must never leak through.
    whitelabel:
      enabled: false

# ---------------------------------------------------------------------------------------------
# Application settings. Every value is overridable by environment variable so that nothing
# sensitive has to be edited into this file to run the service somewhere real.
# ---------------------------------------------------------------------------------------------
notifly:
  security:
    jwt:
      # Development key. JwtService refuses to start with this value under a prod-like profile,
      # so the insecure default cannot ship unnoticed. HS256 needs at least 32 bytes.
      secret: ${JWT_SECRET:dev-only-insecure-signing-key-change-me-in-production-0123456789}
      access-token-ttl: ${JWT_TTL:1h}
      issuer: notifly

    encryption:
      # Encrypts tenant provider credentials at rest. CredentialCipher refuses to start with
      # this value under a prod-like profile. Changing it makes existing credentials
      # undecryptable, so rotate it only with a re-encryption plan.
      key: ${ENCRYPTION_KEY:dev-only-insecure-credential-encryption-key-change-me}

  bootstrap:
    # Created once, only when no platform administrator exists yet.
    admin-email: ${ADMIN_EMAIL:admin@notifly.io}
    admin-password: ${ADMIN_PASSWORD:admin123}
    admin-display-name: ${ADMIN_NAME:Platform Administrator}

  providers:
    email:
      # SIMULATOR (default) or SMTP. SMTP additionally requires spring.mail.username and
      # spring.mail.password; see docs/08-real-providers.md.
      mode: ${EMAIL_PROVIDER:SIMULATOR}
      from-name: ${EMAIL_FROM_NAME:Notifly}

  dispatch:
    # The pollers that drive delivery. Disabled in tests that drive dispatch by hand.
    enabled: ${DISPATCH_ENABLED:true}
    poll-interval-ms: ${DISPATCH_POLL_MS:500}
    # How many notifications one claim cycle takes per channel.
    batch-size: 50
    # How long a claimed notification stays leased. A worker that dies leaves an expired lease
    # that the reaper returns to the queue; too short and a slow provider looks like a crash.
    lease-seconds: 60
    # Ceiling on one tenant's concurrent sends per channel, so no tenant can occupy the pool.
    max-in-flight-per-tenant: 20
    # Bounded queue in front of each pool. Full queue means work stays in the database.
    queue-capacity: 500

    workers:
      EMAIL: 8
      SMS: 4
      PUSH: 8
      IN_APP: 4

    retry:
      max-attempts: 5
      initial-backoff-seconds: 2
      max-backoff-seconds: 300
      multiplier: 2.0
      # Randomises each delay by +/- 20%, so notifications that failed during one outage do not
      # all return at the same instant when the provider recovers.
      jitter-factor: 0.2

    simulator:
      # Raise the failure rates to watch retries and backoff work.
      EMAIL: { min-latency-ms: 5, max-latency-ms: 25, transient-failure-rate: 0.0, permanent-failure-rate: 0.0 }
      SMS: { min-latency-ms: 5, max-latency-ms: 20, transient-failure-rate: 0.0, permanent-failure-rate: 0.0 }
      PUSH: { min-latency-ms: 2, max-latency-ms: 15, transient-failure-rate: 0.0, permanent-failure-rate: 0.0 }
      IN_APP: { min-latency-ms: 0, max-latency-ms: 2, transient-failure-rate: 0.0, permanent-failure-rate: 0.0 }

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
  api-docs:
    path: /v3/api-docs

logging:
  level:
    com.notifly.notification: ${LOG_LEVEL:INFO}
